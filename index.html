<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sqrz</title>
    <meta name="description" content="A game about connecting squares. Play dots and boxes with friends, right in the browser.">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

    <!-- What shows up when someone pastes a link in a chat -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sqrz.drowsy.games/">
    <meta property="og:title" content="sqrz">
    <meta property="og:description" content="A game about connecting squares. Play with friends in your browser.">
    <meta property="og:image" content="https://sqrz.drowsy.games/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        /* Phaser fits the game inside this div, so it needs the full window size */
        #game { width: 100%; height: 100%; }
    </style>

    <!-- MODULES (from a CDN so the game can be hosted as plain static files) -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@2.6.2/build/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@azerion/phaser-input@2.0.5/build/phaser-input.min.js"></script>

    <!-- SERVICES -->
    <script src="./js/services/DeviceService.js"></script>
    <script src="./js/services/UI.js"></script>
    <script src="./js/services/HostService.js"></script>
    <script src="./js/services/NetworkService.js"></script>

    <!-- GAME STATES -->
    <script src="./js/states/Boot.js"></script>
    <script src="./js/states/Menu.js"></script>
    <script src="./js/states/Tutorial.js"></script>
    <script src="./js/states/Sqrz.js"></script>

</head>
<body>
    <script src="./js/app.js"></script>
    <div id="game"></div>
</body>
</html>
